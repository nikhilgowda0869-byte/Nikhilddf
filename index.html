<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Enri Madam 🤍</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
}

.app{
    width:100%;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* SLIDES */

.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    visibility:hidden;
    transition:opacity .7s ease;
}

.slide.active{
    opacity:1;
    visibility:visible;
}

/* FULL IMAGE */

.photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;

    /* Shows the complete photo */
    object-fit:contain;

    background:#000;
}

/* Slight dark overlay at bottom */

.slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0) 50%,
            rgba(0,0,0,.65) 100%
        );

    pointer-events:none;
}

/* PROGRESS */

.progress{
    position:absolute;
    z-index:20;

    top:
        calc(12px + env(safe-area-inset-top));

    left:16px;
    right:16px;

    display:flex;
    gap:5px;
}

.bar{
    height:3px;
    flex:1;

    border-radius:10px;

    background:rgba(255,255,255,.3);

    overflow:hidden;
}

.bar span{
    display:block;

    height:100%;
    width:0;

    background:white;

    transition:.5s;
}

/* CONTENT */

.content{
    position:absolute;

    z-index:10;

    left:0;
    right:0;

    bottom:
        calc(25px + env(safe-area-inset-bottom));

    padding:
        20px
        22px
        25px;

    text-align:center;
}

h1{
    font-family:Georgia,serif;

    font-size:38px;

    font-weight:400;

    line-height:1.08;

    margin-bottom:18px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.7);
}

/* BUTTON */

.next{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:50px;

    padding:14px 25px;

    border-radius:30px;

    border:1px solid
        rgba(255,255,255,.45);

    background:
        rgba(0,0,0,.38);

    color:white;

    font-size:14px;
